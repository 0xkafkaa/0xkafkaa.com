<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0xkafkaa</title>
    <link rel="stylesheet" href="{{ get_url(path='tufte.css') | safe }}" />
    <link rel="stylesheet" href="{{ get_url(path='custom.css') | safe }}" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="{{ get_url(path='favicon.ico') | safe }}"
    />
    <script>
      MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
        },
        svg: {
          fontCache: "global",
        },
      };
    </script>
    <script
      type="text/javascript"
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
    ></script>
  </head>
  <body>
    <article>{% block content %} {% endblock content %}</article>
    <footer class="footer-container">
      <div><span>0xkafkaa© 2026</span></div>
      <div class="footer-inner-container-two">
        <div><a href="/">Home</a></div>
        <div><a href="/writings">Writings</a></div>
        <div><a href="/atom.xml">RSS</a></div>
      </div>
    </footer>
  </body>
</html>
